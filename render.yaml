services:
  - type: web
    name: caffsense-frontend
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: caffsense-backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: caffsense-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: FRONTEND_URL
        fromService:
          type: web
          name: caffsense-frontend
          envVarKey: RENDER_EXTERNAL_URL
